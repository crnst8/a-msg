[package]
name = "amsg-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "amsg_desktop_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "=4.2.0"
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
log = "0.4"
