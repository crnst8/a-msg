[project]
name = "amsg-service"
version = "0.1.0"
description = "a-msg service: conversations, files and app actions beside Hermes"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "pydantic==2.14.3",
  "python-multipart==0.0.33",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "pywebpush==2.5.0",
]

[project.scripts]
amsg = "amsg.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "pyinstaller==6.22.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amsg"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
